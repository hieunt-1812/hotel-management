services:
  postgres:
    image: postgres:15
    container_name: hotel_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hotel_db
    # Host ports 5433/6380 so this project can run alongside nestjs-tutorial (5432/6379)
    ports:
      - "5433:5432"
    volumes:
      - hotel_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: hotel_redis
    restart: always
    ports:
      - "6380:6379"

volumes:
  hotel_postgres_data:
